<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17324d">
<title>Kundenzeit</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f1f4f7;color:#17202a}
header{background:#17324d;color:white;padding:20px 16px;text-align:center}h1{margin:0 0 5px;font-size:28px}header small{opacity:.85}
main{max-width:700px;margin:auto;padding:14px}.card{background:white;border-radius:18px;padding:17px;margin:12px 0;box-shadow:0 3px 12px #0001}
label{font-weight:800;display:block;margin:10px 0 7px}input,button{width:100%;font-size:18px;padding:14px;border-radius:12px;border:1px solid #ccd4dc}
button{border:0;font-weight:800;margin-top:10px}.save{background:#17324d;color:white}.voice{background:#e7edf3;color:#17324d}.pdf{background:#17324d;color:white}
.nav{display:flex;gap:8px;align-items:center}.nav button{margin:0;width:auto;padding:11px 16px}.kw{flex:1;text-align:center;font-size:20px;font-weight:900}
.total{text-align:center;font-size:36px;font-weight:900}.total small{display:block;font-size:15px;color:#68737d}
.day{padding:13px 0;border-bottom:1px solid #e4e8eb}.day:last-child{border-bottom:0}.dayhead{font-weight:900;display:flex;justify-content:space-between}
.entry{display:flex;justify-content:space-between;padding:9px 0}.hours{font-weight:900}.muted{text-align:center;color:#77838e;padding:10px}
</style>
</head>
<body>
<header><h1>⏱️ Kundenzeit</h1><small>Wochenbericht</small></header>
<main>
<section class="card">
<div class="total"><span id="todayTotal">0,00</span> h<small>GESAMT HEUTE</small></div>
</section>

<section class="card">
<label>Kunde</label>
<input id="kunde" placeholder="z. B. Müller">
<label>Arbeitsstunden</label>
<input id="stunden" type="number" inputmode="decimal" step="0.25" min="0" placeholder="z. B. 4">
<button class="save" onclick="add()">+ Eintrag speichern</button>
<button class="voice" onclick="startVoice()">🎙️ Kunde + Stunden ansagen</button>
<div class="muted">Beispiel: „Müller 4 Stunden“</div>
</section>

<section class="card">
<div class="nav">
<button onclick="changeWeek(-1)">‹ KW</button>
<div class="kw" id="kw"></div>
<button onclick="changeWeek(1)">KW ›</button>
</div>
<div class="muted" id="weekTotal"></div>
<div id="week"></div>
<button class="pdf" onclick="createReport()">📄 Wochenbericht erstellen</button>
</section>
</main>

<script>
const KEY="kundenzeit_final_v1";
let entries=JSON.parse(localStorage.getItem(KEY)||"[]");
let selected=new Date();

function save(){localStorage.setItem(KEY,JSON.stringify(entries))}
function iso(d){let x=new Date(d);return new Date(x.getTime()-x.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function monday(d){let x=new Date(d);let n=(x.getDay()+6)%7;x.setDate(x.getDate()-n);x.setHours(0,0,0,0);return x}
function weekNumber(d){let x=monday(d);let y=new Date(x);y.setDate(y.getDate()+3);let first=monday(new Date(y.getFullYear(),0,4));return Math.round((x-first)/604800000)+1}
function start(){return monday(selected)}
function changeWeek(n){selected.setDate(selected.getDate()+n*7);render()}
function add(){
 let k=document.getElementById("kunde").value.trim(),h=parseFloat(document.getElementById("stunden").value.replace(",","."));
 if(!k||!isFinite(h)||h<=0){alert("Bitte Kunde und Stunden eingeben.");return}
 entries.push({date:iso(new Date()),kunde:k,stunden:h});save();
 document.getElementById("kunde").value="";document.getElementById("stunden").value="";render()
}
function render(){
 let s=start(),kw=weekNumber(s),year=s.getFullYear();
 document.getElementById("kw").textContent=`KW ${kw} · ${year}`;
 let today=iso(new Date()),tt=entries.filter(e=>e.date===today).reduce((a,e)=>a+Number(e.stunden),0);
 document.getElementById("todayTotal").textContent=tt.toLocaleString("de-DE",{minimumFractionDigits:2});
 let total=0,out="";
 for(let i=0;i<7;i++){
  let d=new Date(s);d.setDate(d.getDate()+i);let key=iso(d);
  let es=entries.filter(e=>e.date===key),sum=es.reduce((a,e)=>a+Number(e.stunden),0);total+=sum;
  out+=`<div class="day"><div class="dayhead"><span>${d.toLocaleDateString("de-DE",{weekday:"long",day:"2-digit",month:"2-digit"})}</span><span>${sum.toLocaleString("de-DE",{minimumFractionDigits:2})} h</span></div>`;
  out+=es.length?es.map(e=>`<div class="entry"><span>${esc(e.kunde)}</span><span class="hours">${Number(e.stunden).toLocaleString("de-DE",{minimumFractionDigits:2})} h</span></div>`).join(""):'<div class="muted">Keine Einträge</div>';
  out+="</div>";
 }
 document.getElementById("weekTotal").textContent=`Gesamt KW ${kw}: ${total.toLocaleString("de-DE",{minimumFractionDigits:2})} h`;
 document.getElementById("week").innerHTML=out
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

function startVoice(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){alert("Direkte Sprachsteuerung wird auf diesem iPhone-Web-App-Modus nicht zuverlässig unterstützt. Bitte im Stundenfeld das iPhone-Mikrofon für die Diktierfunktion verwenden.");document.getElementById("stunden").focus();return}
 const r=new SR();r.lang="de-DE";r.interimResults=false;r.maxAlternatives=1;
 r.onresult=e=>{
  let t=e.results[0][0].transcript.trim(),m=t.match(/(.+?)\s+(\d+(?:[,.]\d+)?)\s*(?:stunden?|std\.?|h)?$/i);
  if(m){document.getElementById("kunde").value=m[1].trim();document.getElementById("stunden").value=m[2].replace(",",".");add()}
  else alert("Bitte z. B. „Müller 4 Stunden“ sagen.");
 };
 r.onerror=()=>{document.getElementById("stunden").focus();alert("Bitte das Mikrofon direkt über die iPhone-Tastatur verwenden.")};
 r.start();
}

function createReport(){
 const s=start(),kw=weekNumber(s),year=s.getFullYear();
 let rows=[];
 for(let i=0;i<7;i++){
  let d=new Date(s);d.setDate(d.getDate()+i);let key=iso(d);
  let es=entries.filter(e=>e.date===key);
  es.forEach(e=>rows.push({date:d,kunde:e.kunde,stunden:Number(e.stunden)}));
 }
 let html=`<!doctype html><html lang="de"><meta charset="utf-8"><title>Wochenbericht KW ${kw}</title>
 <style>body{font-family:Arial;margin:30px;color:#111}h1{margin-bottom:4px}.meta{margin-bottom:20px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #222;padding:8px}th{background:#eee;text-align:left}.num{text-align:right}.total{font-weight:bold;font-size:18px;margin-top:15px}</style>
 <h1>Lugstein Haustechnik</h1><div class="meta"><b>Name:</b> Ivan Gancov &nbsp;&nbsp; <b>Kalenderwoche:</b> ${kw} &nbsp;&nbsp; <b>Jahr:</b> ${year}</div>
 <table><tr><th>Datum</th><th>Kunde</th><th>Stunden</th></tr>`;
 rows.forEach(r=>html+=`<tr><td>${r.date.toLocaleDateString("de-DE")}</td><td>${esc(r.kunde)}</td><td class="num">${r.stunden.toLocaleString("de-DE",{minimumFractionDigits:2})}</td></tr>`);
 let total=rows.reduce((a,r)=>a+r.stunden,0);
 html+=`</table><div class="total">Gesamt KW ${kw}: ${total.toLocaleString("de-DE",{minimumFractionDigits:2})} Stunden</div>`;
 const w=window.open("","_blank"); if(!w){alert("Bitte Pop-ups für diese Seite erlauben.");return}
 w.document.write(html);w.document.close();setTimeout(()=>w.print(),300);
}
render();
</script>
</body></html>
